<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Shield body with glow -->
  <g filter="url(#glow)">
    <path d="M 256 70 
             C 340 70, 395 105, 395 160 
             C 395 285, 320 380, 256 425 
             C 192 380, 117 285, 117 160 
             C 117 105, 172 70, 256 70 Z" 
          fill="url(#shieldGrad)" />
  </g>

  <!-- Inner shield border -->
  <path d="M 256 88 
           C 328 88, 375 118, 375 165 
           C 375 272, 310 358, 256 398 
           C 202 358, 137 272, 137 165 
           C 137 118, 184 88, 256 88 Z" 
        fill="#0f172a" />

  <!-- Colombian Flag mini-accent stripes -->
  <path d="M 196 160 L 316 160" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" />
  <path d="M 208 174 L 304 174" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
  <path d="M 220 186 L 292 186" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />

  <!-- Document / Report Icon inside shield -->
  <g transform="translate(196, 210)">
    <rect x="0" y="0" width="120" height="150" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="4" />
    <!-- Document lines -->
    <line x1="20" y1="36" x2="100" y2="36" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" />
    <line x1="20" y1="60" x2="100" y2="60" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="84" x2="80" y2="84" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="108" x2="60" y2="108" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
    
    <!-- Checkmark badge in bottom corner of document -->
    <circle cx="102" cy="132" r="22" fill="#10b981" stroke="#0f172a" stroke-width="4" />
    <path d="M 94 132 L 100 138 L 112 126" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Police star at top -->
  <circle cx="256" cy="125" r="14" fill="url(#goldGrad)" />
</svg>
